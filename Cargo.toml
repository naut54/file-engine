[package]
name = "file-engine"
version = "2.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Async, cross-platform file operations engine for desktop apps and developer tools: copy, move, sync, watch, and compress files with progress reporting and cancellation."
repository = "https://github.com/naut54/file-engine"
readme = "README.md"
keywords = ["filesystem", "io", "async", "tokio", "copy"]
categories = ["filesystem", "asynchronous"]
# `fault-harness/` is a sibling dev-tool crate (see
# dev-docs/design/fault-injection-harness.md) that depends on this crate
# via a path dependency, not the other way around — excluded so it never
# rides along in the published tarball.
exclude = ["/fault-harness"]

[features]
default     = ["operations", "analyze"]

# `operations` pulls in `dep:libc`/`dep:windows-sys` for the
# filesystem-capability probe (src/profiler/fs_caps.rs) and
# `dep:unicode-normalization` for path-comparison normalization
# (src/paths.rs) — both needed unconditionally by copy/move/sync, not
# gated behind their own feature the way `permissions` is, since
# filesystem-capability detection isn't optional preservation behavior,
# it's a correctness pre-flight check.
operations  = ["dep:walkdir", "dep:libc", "dep:windows-sys", "dep:unicode-normalization"]
# `jwalk` rather than `walkdir`: analyze's walk is read-only stat/aggregate
# work over the whole tree, exactly the shape jwalk's rayon-backed parallel
# directory reads help most on large trees (see `AnalyzeBuilder::walk_concurrency`).
# `operations` keeps `walkdir` separately for `profiler::scan`, which is fine
# with a single-threaded walk since it's paired 1:1 with a copy/move pipeline
# that's already the bottleneck.
analyze     = ["dep:jwalk", "dep:infer", "dep:globset"]
checksum    = ["analyze", "dep:blake3"]
watch       = ["dep:notify"]
compress    = ["operations", "dep:zip", "dep:flate2"]
permissions = ["operations"]
sync        = ["operations", "analyze"]
diagnostics = ["dep:error-engine"]

[dependencies]
# `time` backs the destination-size sampling in `planner/dispatcher.rs`
# (`Progress::EntryProgress`). Declared explicitly rather than relied on
# via feature unification from another dependency.
tokio = { version = "1", features = ["fs", "rt", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "1"

walkdir      = { version = "2",   optional = true }
jwalk        = { version = "0.9", optional = true }
infer        = { version = "0.16", optional = true }
globset      = { version = "0.4", optional = true }
blake3       = { version = "1",   optional = true }
notify       = { version = "6",   optional = true }
zip          = { version = "2",   optional = true }
flate2       = { version = "1",   optional = true }
error-engine = { version = "0.2", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
filetime = "0.2"

# Each example below calls its operation unconditionally — gating it
# here means Cargo just skips building it for feature sets that don't
# include what it needs, instead of failing the whole build (e.g.
# `--features watch` alone, which doesn't imply `operations`).
[[example]]
name = "basic_copy"
required-features = ["operations"]

[[example]]
name = "basic_move"
required-features = ["operations"]

[[example]]
name = "basic_sync"
required-features = ["sync"]

[[example]]
name = "basic_watch"
required-features = ["watch"]

[[example]]
name = "basic_compress"
required-features = ["compress"]

[target."cfg(unix)".dependencies]
libc = { version = "0.2", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"], optional = true }
