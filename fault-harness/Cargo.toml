[package]
name = "fault-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
file-engine = { path = "..", features = ["operations", "sync"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
